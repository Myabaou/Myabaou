name: Profile Summary Cards

on:
  schedule:
    - cron: "0 15 * * *" # 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-push
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The action wipes profile-summary-card-output on every run,
      # so stash the light theme before generating the dark one.
      - name: Generate cards (light)
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: Asia/Tokyo
          THEME: github
          AUTO_PUSH: false
      - name: Stash light cards
        run: sudo mv profile-summary-card-output/github "$RUNNER_TEMP/github"
      - name: Generate cards (dark)
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          TIME_ZONE: Asia/Tokyo
          THEME: github_dark
          AUTO_PUSH: false
      - name: Commit and push
        run: |
          sudo mv "$RUNNER_TEMP/github" profile-summary-card-output/github
          sudo chown -R "$(id -u):$(id -g)" profile-summary-card-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate profile summary cards"
            git push
          fi
